spring:
  application:
    name: lifeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeline}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

lifeline:
  jwt:
    secret: ${JWT_SECRET:cognora-lifeline-hackathon-super-secret-key-change-in-production-please-2025}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cognora.lifeline: INFO
